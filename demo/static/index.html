<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groundhog: see what an AI agent is actually fed from a page</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 760px;
    margin: 3rem auto;
    padding: 0 1.25rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  p.sub { color: #767676; margin-top: 0; }
  form { display: flex; gap: 0.5rem; margin: 1.5rem 0; }
  input[type=url] {
    flex: 1;
    padding: 0.6rem 0.8rem;
    font-size: 1rem;
    border: 1px solid #999;
    border-radius: 6px;
  }
  button {
    padding: 0.6rem 1.2rem;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #1a73e8;
    color: white;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .field { margin-bottom: 1rem; }
  .field .label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; color: #767676; }
  .threats { border-left: 3px solid #d93025; padding-left: 0.75rem; }
  pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: rgba(127, 127, 127, 0.1);
    padding: 1rem;
    border-radius: 6px;
    max-height: 480px;
    overflow-y: auto;
  }
  footer { margin-top: 3rem; font-size: 0.85rem; color: #767676; }
  a { color: #1a73e8; }
  .error { color: #d93025; }
</style>
</head>
<body>
  <h1>Groundhog</h1>
  <p class="sub">Paste a URL. See what an AI agent would actually be fed: clean markdown, provenance, and any hidden-instruction text stripped out and reported.</p>

  <form id="fetch-form">
    <input type="url" id="url" placeholder="https://example.com" required>
    <button type="submit">Fetch</button>
  </form>

  <div id="result"></div>

  <footer>
    <a href="https://github.com/dmytrome/groundhog">github.com/dmytrome/groundhog</a> &middot;
    <code>uvx groundhog-mcp</code> to run it yourself, no rate limit.
  </footer>

<script>
const form = document.getElementById("fetch-form");
const result = document.getElementById("result");
const button = form.querySelector("button");

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const url = document.getElementById("url").value.trim();
  button.disabled = true;
  button.textContent = "Fetching…";
  result.innerHTML = "";
  try {
    const res = await fetch("/api/fetch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!res.ok) {
      result.innerHTML = `<p class="error">${escapeHtml(data.detail || "Request failed.")}</p>`;
      return;
    }
    let html = "";
    html += `<div class="field"><div class="label">Title</div>${escapeHtml(data.title || "(none)")}</div>`;
    html += `<div class="field"><div class="label">Final URL</div>${escapeHtml(data.final_url)}</div>`;
    if (data.threats?.length) {
      html += `<div class="field threats"><div class="label">Stripped as hidden-instruction text (${data.threats.length})</div>`;
      html += data.threats.map(t => `<div>${escapeHtml(t.type)}: ${escapeHtml(t.reason)} ("${escapeHtml(t.excerpt)}")</div>`).join("");
      html += `</div>`;
    }
    html += `<div class="field"><div class="label">Markdown</div><pre>${escapeHtml(data.markdown)}</pre></div>`;
    result.innerHTML = html;
  } catch {
    result.innerHTML = `<p class="error">Network error, try again.</p>`;
  } finally {
    button.disabled = false;
    button.textContent = "Fetch";
  }
});
</script>
</body>
</html>
