name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v8
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run pytest -q ../benchmark
      - run: uv run --with fastapi==0.162.0 --with httpx==0.28.1 pytest -q ../demo
      - run: uv build --build-constraint build-requirements.txt
      - run: uvx twine check --strict dist/*

  # The suite above skips every test that needs a browser — which is all of the
  # hidden-text and injection-containment coverage, the part most worth gating. Those
  # ran only on a maintainer's machine, so a regression in the strip reached `main`
  # green. This job runs them against the real browser.
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Start the stealth browser
        run: docker compose up --build -d
      - name: Wait for CDP
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null && exit 0
            sleep 2
          done
          echo "CDP never became ready" >&2
          docker compose logs --no-color chrome | tail -50
          exit 1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v8
        with:
          python-version: "3.12"
      - name: Run the browser-backed tests
        working-directory: mcp
        env:
          RUN_LIVE: "1"
          CDP_URL: http://127.0.0.1:9222
          GROUNDHOG_BROWSER: stealth
          GROUNDHOG_AUTO_START_BROWSER: "false"
        run: |
          uv run pytest -q -n 4 -m "not serial" --durations=10
          uv run pytest -q -m serial
      - name: Browser logs on failure
        if: failure()
        run: docker compose logs --no-color chrome | tail -100

  live-chrome:
    runs-on: ubuntu-latest
    env:
      RUN_LIVE: "1"
      CDP_URL: http://127.0.0.1:9222
      GROUNDHOG_BROWSER: chrome
      GROUNDHOG_AUTO_START_BROWSER: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.12"
      - name: Start Chrome once for every test worker
        working-directory: mcp
        env:
          GROUNDHOG_CHROME_PROFILE: ${{ runner.temp }}/chrome
        run: |
          uv run python -c "
          import asyncio
          from groundhog_mcp.config import load_config
          from groundhog_mcp.engine import EngineProvider

          async def start():
              provider = EngineProvider(load_config())
              await provider.start()
              await provider.aclose()

          asyncio.run(start())
          "
      - name: Run the browser-backed tests on the runner's Chrome
        working-directory: mcp
        env:
          GROUNDHOG_CHROME_PROFILE: ${{ runner.temp }}/chrome
        run: |
          uv run pytest -q -n 4 -m "not serial" --durations=10
          uv run pytest -q -m serial
