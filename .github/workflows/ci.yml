name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tested:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      verified: ${{ steps.pr.outputs.verified }}
    steps:
      - name: Check that a merged PR already passed every job on this tree
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          verified=false
          head=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at)][0].head.sha // empty' || true)
          if [ -n "$head" ]; then
            tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha || true)
            head_tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha || true)
            passed=$(gh api "repos/$REPO/commits/$head/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.conclusion == "success") | .name | select(. == "test" or . == "live" or . == "live-chrome")] | unique | length' || true)
            if [ -n "$tree" ] && [ "$tree" = "$head_tree" ] && [ "$passed" = 3 ]; then
              verified=true
            fi
          fi
          echo "PR head ${head:-none}: verified=$verified"
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

  test:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v8
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run pytest -q ../benchmark
      - run: uv run --with fastapi==0.162.0 --with httpx==0.28.1 pytest -q ../demo
      - run: uv build --build-constraint build-requirements.txt
      - run: uvx twine check --strict dist/*

  live:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Start the stealth browser
        run: docker compose up --build -d
      - name: Start the stealth browser behind a proxy
        run: docker run -d --name proxied --shm-size 512m -e PROXY=http://127.0.0.1:9 -p 127.0.0.1:9223:9222 chrome-cdp
      - name: Wait for CDP
        run: |
          for port in 9222 9223; do
            for _ in $(seq 1 60); do
              curl -sf "http://127.0.0.1:$port/json/version" >/dev/null && continue 2
              sleep 2
            done
            echo "CDP on $port never became ready" >&2
            docker compose logs --no-color chrome | tail -50
            docker logs proxied 2>&1 | tail -50
            exit 1
          done
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v8
        with:
          python-version: "3.12"
      - name: Run the browser-backed tests
        working-directory: mcp
        env:
          RUN_LIVE: "1"
          CDP_URL: http://127.0.0.1:9222
          GROUNDHOG_BROWSER: stealth
          GROUNDHOG_AUTO_START_BROWSER: "false"
          GROUNDHOG_TEST_PROXIED_CDP_URL: http://127.0.0.1:9223
        run: uv run pytest -q -n 4 --durations=10
      - name: Browser logs on failure
        if: failure()
        run: docker compose logs --no-color chrome | tail -100

  live-chrome:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    env:
      RUN_LIVE: "1"
      CDP_URL: http://127.0.0.1:9222
      GROUNDHOG_BROWSER: chrome
      GROUNDHOG_AUTO_START_BROWSER: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.12"
      - name: Start Chrome once for every test worker
        working-directory: mcp
        env:
          GROUNDHOG_CHROME_PROFILE: ${{ runner.temp }}/chrome
        run: |
          uv run python -c "
          import asyncio
          from groundhog_mcp.config import load_config
          from groundhog_mcp.engine import EngineProvider

          async def start():
              provider = EngineProvider(load_config())
              await provider.start()
              await provider.aclose()

          asyncio.run(start())
          "
      - name: Run the browser-backed tests on the runner's Chrome
        working-directory: mcp
        env:
          GROUNDHOG_CHROME_PROFILE: ${{ runner.temp }}/chrome
        run: uv run pytest -q -n 4 --durations=10
