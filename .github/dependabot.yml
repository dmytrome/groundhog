version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/mcp"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "hatchling"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/mcp"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "hatchling"
