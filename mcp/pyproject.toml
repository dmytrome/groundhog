[project]
name = "groundhog-mcp"
version = "0.9.3"
description = "Web search, read and research for AI agents, through a real stealth browser"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "dmytrome" }]
keywords = [
    "mcp",
    "agents",
    "search",
    "research",
    "scraping",
    "browser",
    "cdp",
    "stealth",
    "prompt-injection",
    "provenance",
    "ssrf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "mcp>=1.28,<2",
    "websockets>=13",
    "trafilatura>=2.0",
    "tldextract>=5.3",  # top_domain_under_public_suffix
    "py3langid>=0.3",
    "lxml>=6.1.1",
]

[project.urls]
Homepage = "https://github.com/dmytrome/groundhog"
Repository = "https://github.com/dmytrome/groundhog"
Issues = "https://github.com/dmytrome/groundhog/issues"

[project.scripts]
groundhog-mcp = "groundhog_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true
